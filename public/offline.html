<!doctype html>
<!--
  BMU Marketing – shown by public/sw.js when a whole page can't load: "No internet connection" when
  the device is offline, "This site can't be reached" when the internet works but the site doesn't
  answer. Everything is inside this file (it has to work with no server). It copies the design and
  text of src/components/layout/NetworkStatus and src/data/networkStatus.ts – change them together,
  then bump CACHE in public/sw.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BMU Marketing</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(140, 198, 63, 0.08), transparent 70%), #000;
        color: #fff;
        font-family: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        isolation: isolate;
        width: min(560px, 100%);
        padding: 36px 36px 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background:
          radial-gradient(ellipse 60% 45% at 50% 0%, rgba(255, 255, 255, 0.07), transparent 70%),
          linear-gradient(160deg, #1b1c1e 0%, #0e0f10 50%, #070708 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 40px 90px -30px rgba(0, 0, 0, 0.95);
        text-align: center;
        animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.5px),
          radial-gradient(circle at 84% 12%, rgba(255, 255, 255, 0.4) 0 1px, transparent 1.5px),
          radial-gradient(circle at 70% 46%, rgba(255, 255, 255, 0.35) 0 1px, transparent 1.5px),
          radial-gradient(circle at 22% 62%, rgba(255, 255, 255, 0.35) 0 1px, transparent 1.5px),
          radial-gradient(circle at 92% 70%, rgba(255, 255, 255, 0.4) 0 1px, transparent 1.5px),
          radial-gradient(circle at 6% 88%, rgba(255, 255, 255, 0.3) 0 1px, transparent 1.5px),
          radial-gradient(circle at 54% 92%, rgba(255, 255, 255, 0.3) 0 1px, transparent 1.5px);
        animation: stars 6s ease-in-out infinite alternate;
        pointer-events: none;
      }
      @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
      @keyframes stars { from { opacity: 0.35; } to { opacity: 1; } }

      /* The animated picture */
      .icon { position: relative; display: grid; place-items: center; width: 140px; height: 120px; margin: 0 auto; }
      .icon::before {
        content: '';
        position: absolute;
        inset: -10px -30px;
        z-index: -1;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.09), transparent);
      }
      .icon svg { width: 120px; height: 120px; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #icon-offline svg { width: 150px; height: 150px; }
      .wifi-bar { stroke: #d9dbde; stroke-width: 6; animation: wifi-search 2.4s ease-in-out infinite; }
      .wifi-bar:nth-child(2) { animation-delay: 0.25s; }
      .wifi-bar:nth-child(1) { animation-delay: 0.5s; }
      @keyframes wifi-search { 0%, 100% { opacity: 0.18; } 35% { opacity: 0.75; } }
      .wifi-dot { fill: #f4f5f6; stroke: none; }
      .wifi-cut { stroke: #121314; stroke-width: 13; }
      .wifi-slash {
        stroke: #fff;
        stroke-width: 5;
        stroke-dasharray: 1;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.55));
        animation: wifi-slash 0.9s 0.2s cubic-bezier(0.65, 0, 0.35, 1) backwards;
      }
      @keyframes wifi-slash { from { stroke-dashoffset: 1; } }
      .disc::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: -1;
        width: 96px;
        height: 96px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #3a3b3e, #1d1e20 70%);
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -54%);
      }
      .globe-line { stroke: #e8e9eb; stroke-width: 2.4; }
      .meridian { transform-box: fill-box; transform-origin: center; animation: globe-turn 4s linear infinite; }
      .meridian.late { animation-delay: -2s; }
      @keyframes globe-turn {
        0% { transform: translateX(-12px) scaleX(0.15); opacity: 0; }
        15% { opacity: 1; }
        50% { transform: translateX(0) scaleX(1); }
        85% { opacity: 1; }
        100% { transform: translateX(12px) scaleX(0.15); opacity: 0; }
      }
      .badge { transform-box: fill-box; transform-origin: center; animation: badge-pulse 1.8s ease-in-out infinite; }
      .badge circle { fill: #111214; stroke: #e8e9eb; stroke-width: 2; }
      .badge path { stroke: #fff; stroke-width: 2.4; }
      @keyframes badge-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }

      /* Text */
      .status {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 6px 14px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: #e6e7e9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.6875rem;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); animation: blink 1.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0.3; } }
      .code { color: #b5bac2; }
      h1 { margin-top: 16px; font-size: clamp(1.375rem, 3.2vw, 1.6875rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
      .text { max-width: 460px; margin: 12px auto 0; color: #b5bac2; font-size: 0.84375rem; line-height: 1.6; }

      /* Buttons */
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
      .primary, .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 150px;
        height: 46px;
        padding: 0 24px;
        border-radius: 999px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: box-shadow 0.25s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }
      .primary {
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: linear-gradient(90deg, #b9bbbe 0%, #eeeff0 18%, #fff 50%, #eeeff0 82%, #c4c6c9 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -2px 6px rgba(0, 0, 0, 0.12), 0 10px 26px -12px rgba(255, 255, 255, 0.3);
        color: #111214;
      }
      .primary:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -2px 6px rgba(0, 0, 0, 0.12), 0 12px 30px -10px rgba(255, 255, 255, 0.45); }
      .primary:active { transform: scale(0.98); }
      .secondary { border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.04); color: #fff; }
      .secondary:hover { border-color: rgba(255, 255, 255, 0.32); background: rgba(255, 255, 255, 0.09); }
      .primary:focus-visible, .secondary:focus-visible { outline: 2px solid #f5f3ee; outline-offset: 3px; }
      .spinner { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.4; }
      .busy .spinner { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Tips */
      .tips {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 26px;
        padding: 18px 4px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        list-style: none;
      }
      .tips li { display: inline-flex; align-items: center; gap: 7px; color: #8b919a; font-size: 0.6875rem; white-space: nowrap; }
      .tips li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

      [hidden] { display: none !important; }

      @media (max-width: 520px) {
        .card { padding: 28px 20px 18px; border-radius: 20px; }
        .icon { transform: scale(0.85); margin: -6px auto -10px; }
        .status { font-size: 0.625rem; }
        .text { font-size: 0.8125rem; }
        .primary, .secondary { flex: 1 1 100%; }
        .tips { flex-direction: column; align-items: center; gap: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, .card::before, .wifi-bar, .wifi-slash, .meridian, .badge, .dot { animation: none; }
        .wifi-bar { opacity: 0.45; }
        .meridian.late { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert" aria-labelledby="heading" aria-describedby="text">
      <!-- Offline: Wi-Fi crossed out -->
      <div class="icon" id="icon-offline">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path class="wifi-bar" d="M28.9 52.9 A44 44 0 0 1 91.1 52.9" />
          <path class="wifi-bar" d="M38.8 62.8 A30 30 0 0 1 81.2 62.8" />
          <path class="wifi-bar" d="M48.7 72.7 A16 16 0 0 1 71.3 72.7" />
          <circle class="wifi-dot" cx="60" cy="86" r="4.5" />
          <path class="wifi-cut" d="M32 28 L88 94" />
          <path class="wifi-slash" d="M32 28 L88 94" pathLength="1" />
        </svg>
      </div>
      <!-- Unreachable: a turning globe with a ✕ -->
      <div class="icon disc" id="icon-unreachable" hidden>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <clipPath id="globe-clip"><circle cx="60" cy="58" r="26" /></clipPath>
          </defs>
          <circle class="globe-line" cx="60" cy="58" r="26" />
          <g clip-path="url(#globe-clip)">
            <path class="globe-line" d="M34 58 H86 M38 45 H82 M38 71 H82" />
            <ellipse class="globe-line meridian" cx="60" cy="58" rx="12" ry="26" />
            <ellipse class="globe-line meridian late" cx="60" cy="58" rx="12" ry="26" />
          </g>
          <g class="badge">
            <circle cx="85" cy="83" r="11" />
            <path d="M80.5 78.5 L89.5 87.5 M89.5 78.5 L80.5 87.5" />
          </g>
        </svg>
      </div>

      <p class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="status">You’re offline</span>
        <span class="code" id="code">· ERR_INTERNET_DISCONNECTED</span>
      </p>
      <h1 id="heading">No internet connection.</h1>
      <p class="text" id="text">
        Looks like your device lost its connection. Check your Wi-Fi or mobile data – we’ll be right here when you’re back online.
      </p>

      <div class="actions">
        <button type="button" class="primary" id="retry">
          <svg viewBox="0 0 24 24" class="spinner" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5" /></svg>
          <span id="retry-label">Try again</span>
        </button>
        <button type="button" class="secondary" id="back">Go back</button>
        <a class="secondary" id="support" href="https://wa.me/918105491414" target="_blank" rel="noopener noreferrer" hidden>Contact support</a>
      </div>

      <ul class="tips" id="tips">
        <li>Check Wi-Fi or mobile data</li>
        <li>Turn off airplane mode</li>
        <li>Restart your router</li>
      </ul>
    </main>

    <script>
      // Offline, or online but the site isn't answering? The card switches to match, and reloads the
      // page by itself once the connection is back.
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var unreachable = {
          status: 'Can’t connect',
          code: '· ERR_CONNECTION_TIMED_OUT',
          heading: 'This site can’t be reached.',
          text: (location.host || 'bmumarketing.in') + ' took too long to respond. It’s not you – it might be us. Please try again in a few minutes.',
          tips: ['Check the web address', 'Clear your browser cache', 'Try again shortly'],
        };

        function show() {
          var offline = !navigator.onLine;
          $('icon-offline').hidden = !offline;
          $('icon-unreachable').hidden = offline;
          $('back').hidden = !offline;
          $('support').hidden = offline;
          if (offline) return; // the page starts out as the offline card
          $('status').textContent = unreachable.status;
          $('code').textContent = unreachable.code;
          $('heading').textContent = unreachable.heading;
          $('text').textContent = unreachable.text;
          $('tips').innerHTML = '';
          unreachable.tips.forEach(function (tip) {
            var li = document.createElement('li');
            li.textContent = tip;
            $('tips').appendChild(li);
          });
        }

        show();
        $('retry').addEventListener('click', function () {
          this.classList.add('busy');
          $('retry-label').textContent = 'Checking…';
          setTimeout(function () { location.reload(); }, 600);
        });
        $('back').addEventListener('click', function () { history.back(); });
        window.addEventListener('online', function () { location.reload(); });
        window.addEventListener('offline', function () { location.reload(); });
      })();
    </script>
  </body>
</html>
