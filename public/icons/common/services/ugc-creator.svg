<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset=".25" stop-color="#9ea1a6"/>
      <stop offset=".5" stop-color="#26272a"/>
      <stop offset=".75" stop-color="#8d9095"/>
      <stop offset="1" stop-color="#d5d7da"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset=".55" stop-color="#101113"/>
      <stop offset="1" stop-color="#060607"/>
